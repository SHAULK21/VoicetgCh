plugins { id 'com.android.application' }
android {
    namespace 'ua.voicereader'
    compileSdk 35
    defaultConfig { applicationId 'ua.voicereader'; minSdk 26; targetSdk 35; versionCode 8; versionName '1.3.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.15.1' }
