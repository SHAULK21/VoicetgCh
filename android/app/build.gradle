plugins { id 'com.android.application' }
android {
    namespace 'ua.voicereader'
    compileSdk 35
    defaultConfig { applicationId 'ua.voicereader'; minSdk 26; targetSdk 35; versionCode 9; versionName '1.3.2' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Release signing comes from CI secrets (ANDROID_KEYSTORE_BASE64 is decoded to this path by the workflow).
    def releaseKeystore=System.getenv('ANDROID_KEYSTORE_FILE')
    signingConfigs {
        if(releaseKeystore) release {
            storeFile file(releaseKeystore)
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'voicereader'
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release { minifyEnabled false; if(releaseKeystore) signingConfig signingConfigs.release } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.15.1' }
