name: Rozkladka (сборка .exe для Windows)

on:
  push:
    paths: ["rozkladka/**", ".github/workflows/rozkladka.yml"]
  pull_request:
    paths: ["rozkladka/**", ".github/workflows/rozkladka.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rozkladka
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml закрепляет Rust 1.100; rustup установит его сам.
      - name: Версия Rust
        run: rustc --version
      - name: Тесты
        run: cargo test
      - name: Сборка exe
        run: cargo build --release
      - name: Выложить exe
        uses: actions/upload-artifact@v4
        with:
          name: rozkladka-exe
          path: rozkladka/target/release/rozkladka.exe
